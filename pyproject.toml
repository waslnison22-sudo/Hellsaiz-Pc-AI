[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hellsaiz-pc-ai"
version = "0.1.0"
description = "Local-first Windows desktop assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
voice = ["sounddevice>=0.4.6", "numpy>=1.26", "pyttsx3>=2.90", "vosk>=0.3.45"]
windows = ["psutil>=7.0", "pycaw>=20260921", "pynput>=1.7.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
hellsaiz-pc-ai = "hellsaiz_pc_ai.app.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
