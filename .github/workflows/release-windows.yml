name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Windows application
        shell: pwsh
        env:
          HELLSAIZ_UPDATE_SIGNING_KEY: ${{ secrets.HELLSAIZ_UPDATE_SIGNING_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          python scripts/set_version.py $version
          if ($LASTEXITCODE -ne 0) { throw "Version setup failed." }

          python -m pip install --upgrade pip
          python -m pip install -e ".[build,windows,voice,vision]"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed." }

          pyinstaller --noconfirm --clean --onedir --windowed --uac-admin --name HellsaizPC_AI --distpath dist/app --workpath build/app --collect-all vosk --collect-all sounddevice --collect-all pycaw --collect-all pynput --collect-all pywinauto --collect-all comtypes --collect-all piper --collect-all onnxruntime --collect-all rapidocr --collect-all mss --collect-all cv2 src/hellsaiz_pc_ai/__main__.py
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed." }

          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name HellsaizLauncher --distpath dist/tools --workpath build/launcher src/hellsaiz_pc_ai/launcher.py
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed." }

          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name HellsaizUpdater --distpath dist/tools --workpath build/updater --collect-all cryptography src/hellsaiz_pc_ai/updater.py
          if ($LASTEXITCODE -ne 0) { throw "Updater build failed." }

      - name: Download previous release manifest for delta build
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = $env:GITHUB_REF_NAME
          $releases = gh release list --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          $previous = $releases | Where-Object {
            $_.tagName -ne $currentTag -and -not $_.isDraft -and -not $_.isPrerelease
          } | Select-Object -First 1

          if ($null -ne $previous) {
            $directory = Join-Path $env:RUNNER_TEMP "hellsaiz-previous-release"
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            gh release download $previous.tagName --pattern "HellsaizPC_AI-update-manifest.json" --pattern "HellsaizPC_AI-update-manifest.sig" --dir $directory
            if ($LASTEXITCODE -eq 0) {
              "tag=$($previous.tagName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "manifest=$directory\HellsaizPC_AI-update-manifest.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "signature=$directory\HellsaizPC_AI-update-manifest.sig" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          }

      - name: Smoke-test frozen desktop, launcher and updater
        shell: pwsh
        run: |
          $tests = @(
            @{ Path = "dist/app/HellsaizPC_AI/HellsaizPC_AI.exe"; Working = "dist/app/HellsaizPC_AI"; Label = "Desktop" },
            @{ Path = "dist/tools/HellsaizLauncher.exe"; Working = "dist/tools"; Label = "Launcher" },
            @{ Path = "dist/tools/HellsaizUpdater.exe"; Working = "dist/tools"; Label = "Updater" }
          )
          foreach ($test in $tests) {
            $exe = (Resolve-Path $test.Path).Path
            $working = (Resolve-Path $test.Working).Path
            $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory $working -PassThru
            if (-not $process.WaitForExit(300000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$($test.Label) package self-test timed out."
            }
            if ($process.ExitCode -ne 0) {
              $diagnostic = Join-Path $env:TEMP "HellsaizPC_AI-package-self-test.log"
              if ($test.Label -eq "Desktop" -and (Test-Path $diagnostic)) {
                Get-Content $diagnostic -Tail 80
              }
              throw "$($test.Label) package self-test failed with exit code $($process.ExitCode)."
            }
            Write-Host "$($test.Label) package self-test passed."
          }

      - name: Assemble and validate ZIP packages
        shell: pwsh
        env:
          HELLSAIZ_UPDATE_SIGNING_KEY: ${{ secrets.HELLSAIZ_UPDATE_SIGNING_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $arguments = @(
            "scripts/package_release.py",
            "--version", $version,
            "--app-dir", "dist/app/HellsaizPC_AI",
            "--launcher", "dist/tools/HellsaizLauncher.exe",
            "--updater", "dist/tools/HellsaizUpdater.exe"
          )
          if ("${{ steps.previous.outputs.manifest }}" -ne "") {
            $arguments += @(
              "--previous-manifest", "${{ steps.previous.outputs.manifest }}",
              "--previous-signature", "${{ steps.previous.outputs.signature }}"
            )
          }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Package or signature generation failed." }

          $fullPackage = "dist/release-assets/HellsaizPC_AI-windows-x64-full.zip"
          $portablePackage = "dist/release-assets/HellsaizPC_AI-windows-x64-portable.zip"
          foreach ($package in @($fullPackage, $portablePackage)) {
            if (-not (Test-Path $package -PathType Leaf)) { throw "Required ZIP package was not created: $package" }
            if ((Get-Item $package).Length -le 0) { throw "ZIP package is empty: $package" }
            Write-Host "Validated ZIP package: $package"
          }

      - name: Compile Windows setup installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not found." }

          & $compiler "/DAppVersion=$version" "installer/HellsaizPC_AI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installer compilation failed." }
          $setup = "dist/HellsaizPC_AI_Setup.exe"
          if (-not (Test-Path $setup -PathType Leaf)) { throw "Windows setup installer is missing." }
          if ((Get-Item $setup).Length -le 0) { throw "Windows setup installer is empty." }
          Copy-Item $setup "dist/release-assets/HellsaizPC_AI_Setup.exe" -Force

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            Get-ChildItem "dist/release-assets/*" -File |
              Where-Object { $_.Extension -in @(".zip", ".json", ".sig", ".exe") } |
              ForEach-Object { $_.FullName }
          )
          if (-not ($assets | Where-Object { $_ -like "*HellsaizPC_AI-windows-x64-full.zip" })) {
            throw "The full ZIP package is missing from release assets."
          }
          if (-not ($assets | Where-Object { $_ -like "*HellsaizPC_AI_Setup.exe" })) {
            throw "The Windows installer is missing from release assets."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Hellsaiz PC AI $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the GitHub release." }
