name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Apply pending refactoring patches
        shell: pwsh
        run: |
          python scripts/apply_pending_patches.py
          if ($LASTEXITCODE -ne 0) { throw "Patch pipeline failed." }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          python -m pip install -e ".[dev,build,windows,voice,vision]"
          if ($LASTEXITCODE -ne 0) { throw "Validation/build dependencies could not be installed." }

      - name: Run Ruff and Windows test suite
        shell: pwsh
        run: |
          ruff check .
          if ($LASTEXITCODE -ne 0) { throw "Ruff found issues." }
          python -m pytest -q --junitxml=dist-release-pytest.xml
          if ($LASTEXITCODE -ne 0) { throw "Windows test suite failed." }

      - name: Validate workflow YAML
        shell: pwsh
        run: |
          python -m pip install pyyaml
          if ($LASTEXITCODE -ne 0) { throw "Could not install YAML validation dependency." }
          python scripts/validate_workflow_yaml.py .github/workflows/ci.yml .github/workflows/release-windows.yml
          if ($LASTEXITCODE -ne 0) { throw "Workflow YAML validation failed." }

      - name: Build Windows application
        shell: pwsh
        env:
          HELLSAIZ_UPDATE_SIGNING_KEY: ${{ secrets.HELLSAIZ_UPDATE_SIGNING_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          python scripts/set_version.py $version
          if ($LASTEXITCODE -ne 0) { throw "Version setup failed." }

          pyinstaller --noconfirm --clean --onedir --windowed --uac-admin --name HellsaizPC_AI --distpath dist/app --workpath build/app --collect-all vosk --collect-all sounddevice --collect-all pycaw --collect-all pynput --collect-all pywinauto --collect-all comtypes --collect-all piper --collect-all onnxruntime --collect-all rapidocr --collect-all mss --collect-all cv2 src/hellsaiz_pc_ai/__main__.py
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed." }

          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name HellsaizLauncher --distpath dist/tools --workpath build/launcher src/hellsaiz_pc_ai/launcher.py
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed." }

          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name HellsaizUpdater --distpath dist/tools --workpath build/updater --collect-all cryptography src/hellsaiz_pc_ai/updater.py
          if ($LASTEXITCODE -ne 0) { throw "Updater build failed." }

      - name: Download previous release manifest for delta build
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = $env:GITHUB_REF_NAME
          $releases = gh release list --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          $requiredPreviousAssets = @(
            "HellsaizPC_AI-update-manifest.json",
            "HellsaizPC_AI-update-manifest.sig",
            "HellsaizPC_AI-windows-x64-portable.zip"
          )
          $previous = $null
          foreach ($candidate in $releases) {
            if ($candidate.tagName -eq $currentTag -or $candidate.isDraft -or $candidate.isPrerelease) {
              continue
            }
            $candidateRelease = gh release view $candidate.tagName --json assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              continue
            }
            $candidateAssetNames = @($candidateRelease.assets | ForEach-Object { $_.name })
            $hasRequiredAssets = $true
            foreach ($requiredAsset in $requiredPreviousAssets) {
              if ($candidateAssetNames -notcontains $requiredAsset) {
                $hasRequiredAssets = $false
                break
              }
            }
            if ($hasRequiredAssets) {
              $previous = $candidate
              break
            }
          }

          if ($null -eq $previous) {
            throw "No previous stable release with a complete portable update baseline was found."
          }
          $directory = Join-Path $env:RUNNER_TEMP "hellsaiz-previous-release"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          gh release download $previous.tagName --pattern "HellsaizPC_AI-update-manifest.json" --pattern "HellsaizPC_AI-update-manifest.sig" --pattern "HellsaizPC_AI-windows-x64-portable.zip" --dir $directory
            if ($LASTEXITCODE -eq 0) {
              "tag=$($previous.tagName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "version=$($previous.tagName.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "manifest=$directory\HellsaizPC_AI-update-manifest.json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "signature=$directory\HellsaizPC_AI-update-manifest.sig" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "portable=$directory\HellsaizPC_AI-windows-x64-portable.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            } else {
              throw "Previous stable release assets could not be downloaded."
            }
            if (-not (Test-Path (Join-Path $directory "HellsaizPC_AI-windows-x64-portable.zip") -PathType Leaf)) {
              throw "Previous stable release does not contain the portable launcher layout required for update testing."
            }
          }

      - name: Smoke-test frozen desktop, launcher and updater
        shell: pwsh
        run: |
          $tests = @(
            @{ Path = "dist/app/HellsaizPC_AI/HellsaizPC_AI.exe"; Working = "dist/app/HellsaizPC_AI"; Label = "Desktop" },
            @{ Path = "dist/tools/HellsaizLauncher.exe"; Working = "dist/tools"; Label = "Launcher" },
            @{ Path = "dist/tools/HellsaizUpdater.exe"; Working = "dist/tools"; Label = "Updater" }
          )
          foreach ($test in $tests) {
            $exe = (Resolve-Path $test.Path).Path
            $working = (Resolve-Path $test.Working).Path
            $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory $working -PassThru
            if (-not $process.WaitForExit(300000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$($test.Label) package self-test timed out."
            }
            if ($process.ExitCode -ne 0) {
              $diagnostic = Join-Path $env:TEMP "HellsaizPC_AI-package-self-test.log"
              if ($test.Label -eq "Desktop" -and (Test-Path $diagnostic)) {
                Get-Content $diagnostic -Tail 80
              }
              throw "$($test.Label) package self-test failed with exit code $($process.ExitCode)."
            }
            Write-Host "$($test.Label) package self-test passed."
          }

      - name: Assemble and validate ZIP packages
        shell: pwsh
        env:
          HELLSAIZ_UPDATE_SIGNING_KEY: ${{ secrets.HELLSAIZ_UPDATE_SIGNING_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $arguments = @(
            "scripts/package_release.py",
            "--version", $version,
            "--app-dir", "dist/app/HellsaizPC_AI",
            "--launcher", "dist/tools/HellsaizLauncher.exe",
            "--updater", "dist/tools/HellsaizUpdater.exe"
          )
          if ("${{ steps.previous.outputs.manifest }}" -ne "") {
            $arguments += @(
              "--previous-manifest", "${{ steps.previous.outputs.manifest }}",
              "--previous-signature", "${{ steps.previous.outputs.signature }}"
            )
          }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Package or signature generation failed." }

          $fullPackage = "dist/release-assets/HellsaizPC_AI-windows-x64-full.zip"
          $portablePackage = "dist/release-assets/HellsaizPC_AI-windows-x64-portable.zip"
          foreach ($package in @($fullPackage, $portablePackage)) {
            if (-not (Test-Path $package -PathType Leaf)) { throw "Required ZIP package was not created: $package" }
            if ((Get-Item $package).Length -le 0) { throw "ZIP package is empty: $package" }
            Write-Host "Validated ZIP package: $package"
          }

      - name: Compile Windows setup installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }
          }
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not found." }

          & $compiler "/DAppVersion=$version" "installer/HellsaizPC_AI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installer compilation failed." }
          $setup = "dist/HellsaizPC_AI_Setup.exe"
          if (-not (Test-Path $setup -PathType Leaf)) { throw "Windows setup installer is missing." }
          if ((Get-Item $setup).Length -le 0) { throw "Windows setup installer is empty." }
          Copy-Item $setup "dist/release-assets/HellsaizPC_AI_Setup.exe" -Force

      - name: Smoke-test Windows setup installation and removal
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "HellsaizPC_AI-Setup-Smoke"
          Remove-Item -Recurse -Force $smokeRoot -ErrorAction SilentlyContinue
          $setupProcess = Start-Process -FilePath (Resolve-Path "dist/HellsaizPC_AI_Setup.exe") -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$smokeRoot"
          ) -PassThru -Wait
          if ($setupProcess.ExitCode -ne 0) {
            throw "Silent installer smoke test failed with exit code $($setupProcess.ExitCode)."
          }

          $activePath = Join-Path $smokeRoot "active.json"
          if (-not (Test-Path $activePath -PathType Leaf)) { throw "Installer did not create active.json." }
          $installed = Get-Content $activePath -Raw | ConvertFrom-Json
          if ($installed.active_version -ne $env:GITHUB_REF_NAME.TrimStart("v")) {
            throw "Installer selected an unexpected application version."
          }
          foreach ($required in @("HellsaizLauncher.exe", "HellsaizUpdater.exe")) {
            if (-not (Test-Path (Join-Path $smokeRoot $required) -PathType Leaf)) {
              throw "Installer did not install $required."
            }
          }
          $versionDirectory = Join-Path $smokeRoot "versions/$($installed.active_version)"
          $installedApp = Join-Path $versionDirectory "HellsaizPC_AI.exe"
          if (-not (Test-Path $installedApp -PathType Leaf)) {
            throw "Installer did not install the versioned desktop executable."
          }

          foreach ($smoke in @(
            @{ Path = $installedApp; Working = $versionDirectory; Label = "Installed desktop" },
            @{ Path = (Join-Path $smokeRoot "HellsaizLauncher.exe"); Working = $smokeRoot; Label = "Installed launcher" },
            @{ Path = (Join-Path $smokeRoot "HellsaizUpdater.exe"); Working = $smokeRoot; Label = "Installed updater" }
          )) {
            $smokeProcess = Start-Process -FilePath $smoke.Path -ArgumentList "--self-test" -WorkingDirectory $smoke.Working -PassThru
            if (-not $smokeProcess.WaitForExit(300000)) {
              Stop-Process -Id $smokeProcess.Id -Force -ErrorAction SilentlyContinue
              throw "$($smoke.Label) self-test timed out after installation."
            }
            if ($smokeProcess.ExitCode -ne 0) {
              throw "$($smoke.Label) self-test failed after installation: exit code $($smokeProcess.ExitCode)."
            }
          }

          $uninstaller = Join-Path $smokeRoot "unins000.exe"
          if (-not (Test-Path $uninstaller -PathType Leaf)) { throw "Installer did not register an uninstaller." }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -PassThru -Wait
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Silent uninstaller smoke test failed with exit code $($uninstallProcess.ExitCode)."
          }
          if (Test-Path $smokeRoot) {
            throw "Uninstaller left the smoke installation directory behind."
          }
          Write-Host "Windows installer install/uninstall smoke test passed."

      - name: Test in-place update from previous stable release
        if: steps.previous.outputs.portable != ''
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "HellsaizPC_AI-Update-Smoke"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Expand-Archive -LiteralPath "${{ steps.previous.outputs.portable }}" -DestinationPath $stage -Force

          $activePath = Join-Path $stage "active.json"
          $active = Get-Content $activePath -Raw | ConvertFrom-Json
          $previousVersion = "${{ steps.previous.outputs.version }}"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($active.active_version -ne $previousVersion) {
            throw "Previous portable package version mismatch. Expected $previousVersion, found $($active.active_version)."
          }

          # Isolate the test user's profile; the updater must leave it untouched.
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "HellsaizPC_AI-Update-Smoke-LocalAppData"
          $userData = Join-Path $env:LOCALAPPDATA "HellsaizPC_AI"
          New-Item -ItemType Directory -Force -Path $userData | Out-Null
          $sentinel = Join-Path $userData "update-smoke-user-data.txt"
          $sentinelContent = "user-data-survives-$previousVersion-to-$version"
          [System.IO.File]::WriteAllText($sentinel, $sentinelContent, [System.Text.UTF8Encoding]::new($false))

          $updateDir = Join-Path $stage "updates/$version"
          New-Item -ItemType Directory -Force -Path $updateDir | Out-Null
          $archive = Join-Path $updateDir "HellsaizPC_AI-windows-x64-full.zip"
          $manifest = Join-Path $updateDir "HellsaizPC_AI-update-manifest.json"
          $signature = Join-Path $updateDir "HellsaizPC_AI-update-manifest.sig"
          Copy-Item "dist/release-assets/HellsaizPC_AI-windows-x64-full.zip" $archive -Force
          Copy-Item "dist/release-assets/HellsaizPC_AI-update-manifest.json" $manifest -Force
          Copy-Item "dist/release-assets/HellsaizPC_AI-update-manifest.sig" $signature -Force

          $updater = Join-Path $stage "HellsaizUpdater.exe"
          $arguments = @(
            "--install",
            "--install-root", $stage,
            "--archive", $archive,
            "--manifest", $manifest,
            "--signature", $signature,
            "--mode", "full",
            "--from-version", $active.active_version,
            "--parent-pid", "0"
          )
          $process = Start-Process -FilePath $updater -ArgumentList $arguments -WorkingDirectory $stage -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "The real $previousVersion -> $version updater smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "The real $previousVersion -> $version updater smoke test failed with exit code $($process.ExitCode)."
          }

          $updated = Get-Content $activePath -Raw | ConvertFrom-Json
          if ($updated.active_version -ne $version) {
            throw "The updater did not switch active.json to $version."
          }
          $healthMarker = Join-Path $stage "health/$version.ok"
          if (-not (Test-Path $healthMarker -PathType Leaf)) {
            throw "The new application did not write its $version health marker."
          }
          if (-not (Test-Path (Join-Path $stage "versions/$previousVersion/HellsaizPC_AI.exe") -PathType Leaf)) {
            throw "The previous $previousVersion application was not retained for rollback."
          }
          if (-not (Test-Path $sentinel -PathType Leaf)) {
            throw "User data was lost during the update."
          }
          if ((Get-Content $sentinel -Raw) -ne $sentinelContent) {
            throw "User data changed during the update."
          }

          # The new app is expected to remain open after writing the marker.
          $newVersionDirectory = Join-Path $stage "versions/$version"
          Get-CimInstance Win32_Process |
            Where-Object {
              $_.Name -eq "HellsaizPC_AI.exe" -and
              $_.ExecutablePath -like "$newVersionDirectory*"
            } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

          Write-Host "Real $previousVersion -> $version update passed: active version, health marker, rollback copy and user data verified."

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            Get-ChildItem "dist/release-assets/*" -File |
              Where-Object { $_.Extension -in @(".zip", ".json", ".sig", ".exe") } |
              ForEach-Object { $_.FullName }
          )
          if (-not ($assets | Where-Object { $_ -like "*HellsaizPC_AI-windows-x64-full.zip" })) {
            throw "The full ZIP package is missing from release assets."
          }
          if (-not ($assets | Where-Object { $_ -like "*HellsaizPC_AI_Setup.exe" })) {
            throw "The Windows installer is missing from release assets."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Hellsaiz PC AI $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the GitHub release." }
