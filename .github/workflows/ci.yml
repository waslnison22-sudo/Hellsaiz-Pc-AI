name: CI
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .

  windows-package:
    name: Windows executable package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build application, launcher and updater
        shell: pwsh
        run: ./scripts/build_preview.ps1

      - name: Upload unsigned preview package
        uses: actions/upload-artifact@v4
        with:
          name: HellsaizPC_AI-windows-x64-preview
          path: dist/preview/HellsaizPC_AI-windows-x64-preview.zip
          if-no-files-found: error
          retention-days: 7
