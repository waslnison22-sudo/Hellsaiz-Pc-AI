name: CI
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .

  windows-package:
    name: Windows executable package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build application, launcher and updater
        shell: pwsh
        run: ./scripts/build_preview.ps1

      - name: Verify preview installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/HellsaizPC_AI_Setup.exe" -PathType Leaf)) { throw "Setup installer is missing." }
          if ((Get-Item "dist/HellsaizPC_AI_Setup.exe").Length -le 0) { throw "Setup installer is empty." }
          Write-Host "Windows executable and installer build verified."
