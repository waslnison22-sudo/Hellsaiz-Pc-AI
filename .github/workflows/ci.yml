name: CI
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows,voice,vision]"
      - name: Run pytest and publish summary
        shell: bash
        run: |
          set +e
          pytest -q --junitxml=pytest-results.xml > pytest-report.txt 2>&1
          status=$?
          cat pytest-report.txt
          {
            echo "## Pytest · ${{ matrix.os }} · Python ${{ matrix.python-version }}"
            echo
            tail -n 100 pytest-report.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Run Ruff and publish summary
        if: always()
        shell: bash
        run: |
          set +e
          ruff check . --output-format=full > ruff-report.txt 2>&1
          status=$?
          cat ruff-report.txt
          {
            echo "## Ruff · ${{ matrix.os }} · Python ${{ matrix.python-version }}"
            echo
            cat ruff-report.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pytest-report.txt
            pytest-results.xml
            ruff-report.txt
          if-no-files-found: ignore
          retention-days: 7

  windows-package:
    name: Windows executable package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build application, launcher and updater
        shell: pwsh
        run: ./scripts/build_preview.ps1

      - name: Verify preview installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/HellsaizPC_AI_Setup.exe" -PathType Leaf)) { throw "Setup installer is missing." }
          if ((Get-Item "dist/HellsaizPC_AI_Setup.exe").Length -le 0) { throw "Setup installer is empty." }
          Write-Host "Windows executable and installer build verified."
