# Обновлённый .github/workflows/ci.yml
# Изменение только одно: добавлен paths-ignore для push и pull_request,
# чтобы docs-only коммиты не запускали 4 тестовые джобы + PyInstaller-сборку.
# Это главный источник расхода минут Actions в проекте.
# Применение: заменить содержимое .github/workflows/ci.yml этим файлом и закоммитить.

name: CI

on:
  push:
    branches: [main, "dev/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            extras: "dev"
            group: core-linux
          - os: ubuntu-latest
            python-version: "3.12"
            extras: "dev"
            group: core-linux
          - os: windows-latest
            python-version: "3.11"
            extras: "dev,windows,voice,vision"
            group: full-windows
          - os: windows-latest
            python-version: "3.12"
            extras: "dev,windows,voice,vision"
            group: full-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending refactoring patches
        shell: bash
        run: python scripts/apply_pending_patches.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install validation dependencies
        shell: bash
        run: python -m pip install pyyaml

      - name: Validate workflow configuration
        shell: bash
        run: python scripts/validate_workflow_yaml.py .github/workflows/ci.yml .github/workflows/release-windows.yml

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee pip-bootstrap.txt
          python -m pip install -e ".[${{ matrix.extras }}]" 2>&1 | tee pip-install.txt

      - name: Run import diagnostics
        shell: bash
        run: |
          python - <<'PY' | tee import-report.txt
          import importlib
          import sys

          modules = [
              "hellsaiz_pc_ai.core.commands",
              "hellsaiz_pc_ai.core.registry",
              "hellsaiz_pc_ai.telegram.config",
              "hellsaiz_pc_ai.telegram.worker",
              "hellsaiz_pc_ai.network.v2raytun",
              "hellsaiz_pc_ai.tools.file_system",
              "hellsaiz_pc_ai.companion.controller",
              "hellsaiz_pc_ai.companion.model_manifest",
              "hellsaiz_pc_ai.startup_task",
              "hellsaiz_pc_ai.app.file_access",
          ]
          if sys.platform == "win32":
              modules += [
                  "PySide6.QtCore", "PySide6.QtWidgets",
                  "hellsaiz_pc_ai.app.desktop",
                  "hellsaiz_pc_ai.tools.ui_automation",
                  "hellsaiz_pc_ai.tools.screen_ocr",
                  "hellsaiz_pc_ai.tools.ocr_models",
                  "rapidocr", "onnxruntime", "mss", "pywinauto", "comtypes",
                  "vosk", "piper", "sounddevice", "numpy", "psutil", "pycaw", "pynput",
              ]
          errors = []
          for module in modules:
              try:
                  importlib.import_module(module)
                  print("OK", module)
              except Exception as error:
                  errors.append((module, type(error).__name__, str(error)))
                  print("FAILED", module, type(error).__name__, str(error))
          if errors:
              raise SystemExit(1)
          PY

      - name: Run Ruff (advisory diagnostics)
        continue-on-error: true
        shell: bash
        run: |
          ruff check . --output-format=full 2>&1 | tee ruff-report.txt
          exit ${PIPESTATUS[0]}

      - name: Run core tests
        if: matrix.group == 'core-linux'
        shell: bash
        run: pytest -q --junitxml=pytest-core.xml

      - name: Run full Windows test suite
        if: matrix.group == 'full-windows'
        shell: pwsh
        run: |
          python -m pytest -q --junitxml=pytest-windows.xml
          if ($LASTEXITCODE -ne 0) { throw "Windows pytest suite failed." }

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.group }}-py${{ matrix.python-version }}
          path: |
            pip-bootstrap.txt
            pip-install.txt
            import-report.txt
            pytest-core.xml
            pytest-windows.xml
            ruff-report.txt
          if-no-files-found: warn
          retention-days: 7

  windows-package:
    name: Windows executable package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending refactoring patches
        shell: bash
        run: python scripts/apply_pending_patches.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and verify Windows package
        shell: pwsh
        run: ./scripts/build_preview.ps1
