name: CI
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        shell: bash
        run: |
          set +e
          python -m pip install --upgrade pip > pip-install-report.txt 2>&1
          first_status=$?
          python -m pip install -e ".[dev,windows,voice,vision]" >> pip-install-report.txt 2>&1
          install_status=$?
          cat pip-install-report.txt
          {
            echo "## Dependency installation · ${{ matrix.os }} · Python ${{ matrix.python-version }}"
            cat pip-install-report.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$first_status" -ne 0 ] || [ "$install_status" -ne 0 ]; then exit 1; fi
      - name: Diagnose imports and lint before tests
        shell: bash
        run: |
          set +e
          python - <<'PY' > diagnostics.txt 2>&1
          import importlib
          modules = [
              "PySide6.QtCore", "PySide6.QtWidgets",
              "hellsaiz_pc_ai.app.desktop", "hellsaiz_pc_ai.telegram.config",
              "hellsaiz_pc_ai.telegram.worker", "hellsaiz_pc_ai.network.v2raytun",
              "hellsaiz_pc_ai.tools.file_system", "hellsaiz_pc_ai.tools.ui_automation",
              "hellsaiz_pc_ai.companion.controller", "hellsaiz_pc_ai.companion.model_manifest",
              "hellsaiz_pc_ai.startup_task", "hellsaiz_pc_ai.app.file_access",
              "hellsaiz_pc_ai.tools.screen_ocr", "hellsaiz_pc_ai.tools.ocr_models",
              "rapidocr", "onnxruntime", "mss", "pywinauto", "comtypes",
              "vosk", "piper", "sounddevice", "numpy", "psutil", "pycaw", "pynput",
          ]
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
                  print("OK", name)
              except Exception as exc:
                  failed.append(name)
                  print("FAILED", name, type(exc).__name__, str(exc))
          raise SystemExit(1 if failed else 0)
          PY
          import_status=$?
          cat diagnostics.txt
          ruff check . --output-format=full > ruff-diagnostics.txt 2>&1
          ruff_status=$?
          cat ruff-diagnostics.txt
          {
            echo "## Pre-test diagnostics · ${{ matrix.os }} · Python ${{ matrix.python-version }}"
            echo '### Imports'
            cat diagnostics.txt
            echo '### Ruff'
            cat ruff-diagnostics.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$import_status" -ne 0 ] || [ "$ruff_status" -ne 0 ]; then exit 1; fi
      - name: Run pytest and publish summary
        shell: bash
        run: |
          set +e
          pytest -q --junitxml=pytest-results.xml > pytest-report.txt 2>&1
          status=$?
          cat pytest-report.txt
          {
            echo "## Pytest · ${{ matrix.os }} · Python ${{ matrix.python-version }}"
            echo
            tail -n 100 pytest-report.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Run Ruff and publish summary
        if: always()
        shell: bash
        run: |
          set +e
          ruff check . --output-format=full > ruff-report.txt 2>&1
          status=$?
          cat ruff-report.txt
          {
            echo "## Ruff · ${{ matrix.os }} · Python ${{ matrix.python-version }}"
            echo
            cat ruff-report.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            pytest-report.txt
            pytest-results.xml
            ruff-report.txt
          if-no-files-found: warn
          retention-days: 7

  windows-package:
    name: Windows executable package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build application, launcher and updater
        shell: pwsh
        run: ./scripts/build_preview.ps1

      - name: Verify preview installer output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/HellsaizPC_AI_Setup.exe" -PathType Leaf)) { throw "Setup installer is missing." }
          if ((Get-Item "dist/HellsaizPC_AI_Setup.exe").Length -le 0) { throw "Setup installer is empty." }
          Write-Host "Windows executable and installer build verified."
